name: your-meter

services:
  api:
    container_name: your-meter-api
    image: your-meter-api:latest
    build:
      context: ../../ReactApp.Server
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "1000:1000"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Data Source=/data/your-meter.db
      Cors__AllowedOrigins__0: https://your-meter.jfilipek.com
      Cors__AllowedOrigins__1: https://licznik.jfilipek.com
      Authentication__CookieDomain: ${YOUR_METER_COOKIE_DOMAIN:-}
      Authentication__BootstrapUsername: ${YOUR_METER_ADMIN_USERNAME:-jakub.filipek}
      Authentication__BootstrapEmail: ${YOUR_METER_ADMIN_EMAIL:-jakub.filipek@gmail.com}
      Authentication__BootstrapPassword: ${YOUR_METER_ADMIN_PASSWORD:-}
      Authentication__DemoUsername: demo
      Authentication__DemoEmail: demo@jfilipek.com
      Authentication__DemoPassword: LicznikDemo2026!
      Simulation__Enabled: "true"
      Simulation__SeedDefaults: "true"
      Simulation__BackfillDays: "180"
      Simulation__HistoricalIntervalMinutes: "60"
      Simulation__LiveIntervalSeconds: "5"
    volumes:
      - ${YOUR_METER_DATA_DIR:-./data}:/data
    expose:
      - "8080"
    networks:
      - edge
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:8080/health
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 512m
    mem_reservation: 128m
    cpus: "1.00"
    pids_limit: 192
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  edge:
    name: floracue-edge
    external: true
